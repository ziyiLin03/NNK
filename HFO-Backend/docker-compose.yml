services:
  db:
    image: postgis/postgis:16-3.4
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=hfo_db
      - POSTGRES_USER=hfo_user
      - POSTGRES_PASSWORD=hfo_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hfo_user -d hfo_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      - DJANGO_ENV=development
      - DJANGO_DEBUG=True
      - DATABASE_URL=
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=hfo_db
      - DB_USER=hfo_user
      - DB_PASSWORD=hfo_password
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
