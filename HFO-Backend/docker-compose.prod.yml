services:
  db:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    restart: always

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - DJANGO_ENV=production
      - DJANGO_DEBUG=False
      - DATABASE_URL=
      - DB_HOST=db
      - DB_PORT=5432
      - PORT=8000
    ports:
      - "8000:8000"
    depends_on:
      - db
    restart: always

volumes:
  postgres_data_prod:
