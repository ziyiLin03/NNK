<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE-edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style/general.css">
    <link rel="stylesheet" href="/style/home.css">
    <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>Home - No Name Kitchen</title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
  </head>

  <body>

<button id="menu-btn">
  <i class="fa-solid fa-bars menu-icon"></i>
  <span style="color: var(--text-dark);">Menu</span>  
</button>

<div class="side-bar" id="sideBar">

  <div class="logo">
    <img style="width: 100%" src="assets/no-name-kitchen-letters.png" alt="">
  </div>

  <div class="side-bar-grid">
    <a  href="/home.html" style="text-decoration: none;">
      <div class="side-bar-row active-item">
        <i class="side-bar-icons fa-solid fa-home"></i>
        <span class="row-text">Home</span>
      </div>
    </a>

    <a href="/start-report.html" id="nav-create" style="text-decoration: none;">
      <div class="side-bar-row">
        <i class="side-bar-icons fa-solid fa-plus"></i>
        <span class="row-text">New Testimonial</span>
      </div>
    </a>

    <a href="/chat.html" id="nav-chat" style="text-decoration: none;">
  <div class="side-bar-row">
    <div style="display: flex; align-items: center; width: 100%;">
      <i class="side-bar-icons fa-regular fa-comments"></i>
      <span class="row-text">Chat</span>
      <span id="chat-badge" class="chat-notification-badge" style="display: none;">0</span>
    </div>
  </div>
</a>

    <a href="/database.html" id="nav-database" style="text-decoration: none;">
      <div class="side-bar-row">
        <i class="side-bar-icons fa-solid fa-database"></i>
        <span class="row-text">Database</span>
      </div>
    </a>

    <a href="/user-management.html" id="nav-user-management" style="text-decoration: none;">
      <div class="side-bar-row">
        <i class="side-bar-icons fa-solid fa-users"></i>
        <span class="row-text">User Management</span>
      </div>
    </a>

    <a href="/dashboard.html" id="nav-dashboard" style="text-decoration: none;">
      <div class="side-bar-row">
        <i class="side-bar-icons fa-solid fa-chart-line"></i>
        <span class="row-text">Dashboard</span>
      </div>
    </a>

  </div>
    
  <div class="side-bar-grid-end">
    <div class="menu-divider"></div>
      
    <button id="settings-btn">
      <i class="side-bar-configuration fa-solid fa-gear" id="gear"></i>
      <span class="row-text">Settings</span>
    </button>
      
    <a href="#" style="text-decoration: none;" onclick="logout()">
      <div class="side-bar-row sign-out-row">
        <i class="side-bar-icons fa-solid fa-right-from-bracket"></i>
        <span class="row-text">Sign out</span>
      </div>
    </a>
  </div>

  <div class="settings-box" id="settings-box">
    <div class="settings-row">
      <i class="fa-solid fa-circle-user settings-icon"></i>
      <p class="settings-text">Profile</p>
    </div>
        
    <div class="settings-row">
      <i class="fa-solid fa-language settings-icon"></i>
      <select id="language-select" class="settings-text" style="background: transparent; border: none; outline: none; cursor: pointer; color: var(--text);">
        <option value="en">English</option>
        <option value="es">Español</option>
        <option value="it">Italiano</option>
      </select>
    </div>

    <div id="google_translate_element" style="display:none;"></div>
        
    <div class="settings-row">
      <i class="fa-solid fa-circle-half-stroke settings-icon"></i>
      <input type="checkbox" class="switch" id="theme">
      <p class="settings-text">Light/ Dark Theme</p>
    </div>
 
    <a  href="/help.html" style="text-decoration: none;">
      <div class="settings-row">
        <i class="fa-solid fa-circle-info settings-icon"></i>
        <p class="settings-text">Help & Support</p>
      </div>
    </a>

    <a href="/about-us.html" style="text-decoration: none;"  > 
      <div class="settings-row">
        <i class="fa-solid fa-people-group settings-icon"></i>
        <p class="settings-text">About Us</p>
      </div>
    </a> 
  </div>
</div>

  <div class="container" id="reports-container">
  </div>
    <!-- Modal de perfil -->
<div class="profile-modal-overlay" id="profileModal">
  <div class="profile-modal">
    <button class="profile-close" id="profileClose">
      <i class="fa-solid fa-xmark"></i>
    </button>
    <div class="profile-top">
      <p class="profile-welcome">Welcome,</p>
      <p class="profile-username" id="profileUsername">username</p>
    </div>
    <div class="profile-bottom">
      <div class="profile-card">
        <i class="profile-role-icon" id="profileIcon"></i>
        <span class="profile-role-badge" id="profileRole">Volunteer</span>
        <div class="profile-divider"></div>
        <!--<p class="profile-since">Member since: <span id="profileDate">January 2025</span></p>-->
        <p class="profile-permissions" id="profilePermissions"></p>
      </div>
    </div>
  </div>
</div>
  <script src="/config.js"></script>
  <script src="/sidebar.js"></script>
  <script src="/translator.js"></script>
  <script src="/home.js"></script> 
</body>

</html>
