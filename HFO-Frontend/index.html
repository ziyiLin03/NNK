<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE-edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - No Name Kitchen</title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
    <link rel="stylesheet" href="/style/login.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    </head>

  <body>
    <div class="wrapper">
      <form id="loginForm">
        <h1>
          <img class="logo" src="/assets/cropped-no-name-kitchen-logo.png">
        </h1>
        <h2>Access to your NNK account</h2>
        
        <div class="input-box">
          <input type="text" id="username" placeholder="Enter username" name="usr" autocomplete="off" required>
          <p id="error_usr" class="error-text">Incorrect username</p>
          <i style="color: black;" class="bx bxs-user"></i>
        </div>
        
        <div class="input-box">
          <input type="password" id="password" placeholder="Enter password" name="pword" autocomplete="off" required>
          <p id="error_pw" class="error-text">Incorrect password</p>
          <i style="color: black;" class="bx bxs-lock-alt"></i>
        </div>
        
        <button type="submit" class="btn">Login</button>
        
        <div class="separation-login"></div>
        <p class="register-text">
          If you are having trouble signing in or want to register, please contact our administrator
        </p>
      </form>
    </div>
    <script src="/config.js"></script>
    <script src="/login.js"></script>
  </body>
</html>
