<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat - No Name Kitchen</title>
  <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
  <link rel="stylesheet" href="/style/general.css">
  <link rel="stylesheet" href="/style/chat.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/style/responsive.css">
</head>
<body>

<button id="menu-btn">
  <i class="fa-solid fa-bars menu-icon"></i>
  <span style="color: var(--text-dark);">Menu</span>  
</button>

<div class="side-bar" id="sideBar">

  <div class="logo">
    <img style="width: 100%" src="assets/no-name-kitchen-letters.png" alt="">
  </div>

  <div class="side-bar-grid">
    <a  href="/home.html" style="text-decoration: none;">
      <div class="side-bar-row">
        <i class="side-bar-icons fa-solid fa-home"></i>
        <span class="row-text">Home</span>
      </div>
    </a>

    <a href="/start-report.html" id="nav-create" style="text-decoration: none;">
      <div class="side-bar-row">
        <i class="side-bar-icons fa-solid fa-plus"></i>
        <span class="row-text">New Testimonial</span>
      </div>
    </a>

    <a href="/chat.html" style="text-decoration: none;">
      <div class="side-bar-row active-item">
        <i class="side-bar-icons fa-regular fa-comments"></i>
        <span class="row-text">Chat</span>
      </div>
    </a>

    <a href="/database.html" id="nav-database" style="text-decoration: none;">
      <div class="side-bar-row">
        <i class="side-bar-icons fa-solid fa-database"></i>
        <span class="row-text">Database</span>
      </div>
    </a>

    <a href="/user-management.html" id="nav-user-management" style="text-decoration: none;">
      <div class="side-bar-row">
        <i class="side-bar-icons fa-solid fa-users"></i>
        <span class="row-text">User Management</span>
      </div>
    </a>

    <a href="/dashboard.html" id="nav-dashboard" style="text-decoration: none;">
      <div class="side-bar-row">
        <i class="side-bar-icons fa-solid fa-chart-line"></i>
        <span class="row-text">Dashboard</span>
      </div>
    </a>
  </div>
    
  <div class="side-bar-grid-end">
    <div class="menu-divider"></div>
      
    <button id="settings-btn">
      <i class="side-bar-configuration fa-solid fa-gear" id="gear"></i>
      <span class="row-text">Settings</span>
    </button>
      
    <a href="#" style="text-decoration: none;" onclick="logout()">
      <div class="side-bar-row sign-out-row">
        <i class="side-bar-icons fa-solid fa-right-from-bracket"></i>
        <span class="row-text">Sign out</span>
      </div>
    </a>
  </div>

  <div class="settings-box" id="settings-box">
    <div class="settings-row">
      <i class="fa-solid fa-circle-user settings-icon"></i>
      <p class="settings-text">Profile</p>
    </div>
        
    <div class="settings-row">
      <i class="fa-solid fa-language settings-icon"></i>
      <select id="language-select" class="settings-text" style="background: transparent; border: none; outline: none; cursor: pointer; color: var(--text);">
        <option value="en">English</option>
        <option value="es">Español</option>
        <option value="it">Italiano</option>
      </select>
    </div>

    <div id="google_translate_element" style="display:none;"></div>
        
    <div class="settings-row">
      <i class="fa-solid fa-shield-halved settings-icon"></i>
      <p class="settings-text">Security</p>
    </div>
        
    <div class="settings-row">
      <i class="fa-solid fa-circle-half-stroke settings-icon"></i>
      <input type="checkbox" class="switch" id="theme">
      <p class="settings-text">Light/ Dark Theme</p>
    </div>
 
    <a  href="/help.html" style="text-decoration: none;">
      <div class="settings-row">
        <i class="fa-solid fa-circle-info settings-icon"></i>
        <p class="settings-text">Help & Support</p>
      </div>
    </a>

    <a href="/about-us.html" style="text-decoration: none;"  > 
      <div class="settings-row">
        <i class="fa-solid fa-people-group settings-icon"></i>
        <p class="settings-text">About Us</p>
      </div>
    </a> 
  </div>
</div>

  <input type="checkbox" id="theme" style="display: none;">

  <div class="chat-layout">

    <aside class="chat-sidebar">
      <div class="sidebar-header">
        <h2>Messages</h2>
        <div style="display: flex; gap: 5px;">
          <button class="new-dm-btn" id="newGroupBtn" title="New Group Chat">
            <i style="color: var(--text-dark);" class="fa-solid fa-users-rectangle"></i>
          </button>
          <button class="new-dm-btn" id="newDmBtn" title="New conversation">
            <i style="color: var(--text-dark);" class="fa-solid fa-pen-to-square"></i>
          </button>
        </div>
      </div>

      <div class="room-list" id="roomList">
        <div class="room-item active" data-type="global" data-id="global">
          <div class="room-avatar global-avatar">
            <i class="fa-solid fa-earth-europe"></i>
          </div>
          <div class="room-info">
            <span class="room-name">Public Chat</span>
            <span class="room-preview" id="globalPreview">Every Staff Member</span>
          </div>
          <span class="unread-badge" id="globalUnread" style="display:none;"></span>
        </div>
        </div>

      <div class="user-picker" id="userPicker" style="display:none;">
        <div class="user-picker-header">
          <span>Start a conversation</span>
          <button id="closeUserPicker"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <input type="text" id="userSearch" placeholder="Search users..." autocomplete="off">
        <div class="user-picker-list" id="userPickerList"></div>
      </div>

      <div class="user-picker" id="groupModal" style="display:none;">
        <div class="user-picker-header">
          <span>Create Group Chat</span>
          <button id="closeGroupModal"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <input type="text" id="groupNameInput" placeholder="Group Name..." autocomplete="off" style="padding: 8px; margin: 10px; border: 1px solid #ccc; border-radius: 6px;">
        <div style="padding: 0 10px; font-size: 0.8rem; color: var(--text-muted); font-weight: bold;">SELECT MEMBERS:</div>
        <div class="user-picker-list" id="groupUserPickerList" style="flex: 1; overflow-y: auto;"></div>
        <button id="submitGroupBtn" style="margin: 10px; padding: 10px; background: #27ae60; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">
          Create Group
        </button>
      </div>
    </aside>

    <!-- ── Main chat area ── -->
    <main class="chat-main">
      <header class="chat-header">
        <div class="chat-header-info">
          <div class="chat-avatar" id="chatAvatar">
            <i class="fa-solid fa-earth-europe"></i>
          </div>
          <div>
            <h3 id="chatTitle">Public Chat</h3>
            <p id="chatSubtitle">All the staff members</p>
          </div>
        </div>
      </header>

      <div class="messages-container" id="messagesContainer">
        <div class="messages-loading" id="messagesLoading">
          <i class="fa-solid fa-spinner fa-spin"></i>
        </div>
      </div>

      <footer class="chat-input-bar">
        <textarea
          id="messageInput"
          placeholder="Write a message..."
          rows="1"
          maxlength="1000"
        ></textarea>
        <button class="send-btn" id="sendBtn">
          <i style="color: white;" class="fa-solid fa-paper-plane"></i>
        </button>
      </footer>
    </main>

  </div>

      <!-- Modal de perfil -->
<div class="profile-modal-overlay" id="profileModal">
  <div class="profile-modal">
    <button class="profile-close" id="profileClose">
      <i class="fa-solid fa-xmark"></i>
    </button>
    <div class="profile-top">
      <p class="profile-welcome">Welcome,</p>
      <p class="profile-username" id="profileUsername">username</p>
    </div>
    <div class="profile-bottom">
      <div class="profile-card">
        <i class="profile-role-icon" id="profileIcon"></i>
        <span class="profile-role-badge" id="profileRole">Volunteer</span>
        <div class="profile-divider"></div>
        <!--<p class="profile-since">Member since: <span id="profileDate">January 2025</span></p>-->
        <p class="profile-permissions" id="profilePermissions"></p>
      </div>
    </div>
  </div>
</div>

  <script src="/config.js"></script>
  <script src="/sidebar.js"></script>
  <script src="/chat.js"></script>
  <script src="/translator.js"></script>
</body>
</html>
