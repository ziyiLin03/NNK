<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manual Report - No Name Kitchen</title>
  <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
  <link rel="stylesheet" href="/style/general.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/style/manual-report.css">
</head>
<body>
  
  <a href="/new-report.html" style="text-decoration: none; display: inline-block; margin: 20px;">
    <button class="return-btn">
      <i class="fa-solid fa-arrow-left return-icon"></i>
      <span style="color: var(--text-dark);">Return</span> 
    </button>
  </a>

  <div class="container">
    <h1>Manual Testimonial</h1>
    
    <form id="formTextos">
      <div class="field-row">
        <label for="name">Name:</label>
        <input type="text" id="name" autocomplete="off" placeholder="Testimony Name (Alias or visual identificator, not necessarily real)">
      </div>

      <div class="field-row">
        <label for="years">Age:</label>
        <input type="number" id="years" placeholder="Age (0 - 120)" min="0" max="120">
      </div>

      <div class="field-row">
        <label for="gender">Gender:</label>
        <select id="gender">
          <option value="" disabled selected>Select Gender...</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="Non-Binary">Non-Binary</option>
          <option value="Other">Other</option>
          <option value="Unknown">Unknown</option>
        </select>
      </div>

      <div class="field-row">
        <label for="nationality">Nationality:</label>
        <select id="nationality">
          <option value="" disabled selected>Select Nationality...</option>
        </select>
      </div>

      <div class="field-row">
        <label for="vulnerability_type">Vulnerability Type:</label>
        <select id="vulnerability_type">
          <option value="" disabled selected>Select Vulnerability...</option>
          <option value="pregnant">Pregnant</option>
          <option value="disability">Disability</option>
          <option value="chronic_illness">Chronic Illness</option>
          <option value="injured">Injured</option>
          <option value="traficking_risk">Traficking Risk</option>
          <option value="lgtbq">LGBTQ</option>
          <option value="family_separation">Family Separation</option>
          <option value="religious_risk">Religious Risk</option>
          <option value="other">Other : explain below</option>          

        </select>
      </div>

      <div class="field-row">
        <label for="legal_situation">Legal Situation:</label>
        <select id="legal_situation">
          <option value="" disabled selected>Select Legal Situation...</option>
          <option value="asylum_seeker">Asylum Seeker</option>
          <option value="refugee">Refugee</option>
          <option value="legal_resident">Legal Resident</option>
          <option value="irregular">Irregular</option>
          <option value="unknown">Unknown</option>
          <option value="other">Other : explain below</option>
        </select>
      </div>

      <div class="field-row">
        <label for="description">Description:</label>
        <textarea id="description" placeholder="Description (Details to share with us)"></textarea>
      </div>
      
      <button type="submit" id="btn-submit">Save & Return to Menu</button>
    </form>
  </div>

  <input type="checkbox" id="theme" style="display: none;">
  <script src="/config.js"></script>
  <script src="/sidebar.js"></script>
  <script src="/manual-report.js"></script>
  <script src="/translator.js"></script>
</body>
</html>
